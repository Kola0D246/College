<style>
    label {
        display: inline-block;
        width: 140px;
        text-align: left;
}
</style>

<form action="/action">
    <label for="name">Alphanumeric input:</label> 
    <input type="text" placeholder="Enter name" id="name"> <br>

    <label for="age">Numeric input:</label>
    <input type="number" placeholder="Enter age" id="age"> <br>

    <label for="pass">Password input:</label>
    <input type="password" placeholder="Enter password" id="pass"> <br>

    <label for="date"> Date input:</label>
    <input type="date" id="date"> <br>

    <label for="time">Time input:</label>
    <input type="time" id="time"> <br>

    <label for="color">Color input:</label>
    <input type="color" id="color"> <br>
</form>
