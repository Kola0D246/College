<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table border="1" style="width:500">
        <caption> Web Dev Time Table</caption>
        <tr>
            <th rowspan="4">Week 1</th>
            <th>Day</th>
            <th colspan="2">Time</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>2:30 to 3:30</td>
            <td>pm</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>12:30 to 1:30</td>
            <td>pm</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>4:00 to 5:30</td>
            <td>pm</td>
        </tr>

    </table>
</body>
</html>
